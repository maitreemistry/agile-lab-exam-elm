<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave Balance</title>
</head>
<body>
  <h1>Employee Leave Management</h1>
  <p>Welcome, {{ employee }}.</p>
  <p id="leave-balance">Leaves left: {{ leaves_left }}</p>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <p role="status" class="{{ category }}">{{ message }}</p>
  {% endfor %}
  <form method="post" action="{{ url_for('request_leave') }}">
    <label for="days">Days to request</label>
    <input id="days" name="days" type="number" min="1" required>
    <button type="submit">Request leave</button>
  </form>
  <form method="post" action="{{ url_for('logout') }}">
    <button type="submit">Logout</button>
  </form>
</body>
</html>
